<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070B">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Monitoring Distribusi</title>
<style>
:root{--bg:#06070B;--card:#0F1118;--tile:#171A25;--line:#1C2030;--tx:#F4F6FB;--mut:#8D93A6;--ac:#3E5BFF;--acs:#8FA2FF;--red:#F87171}
*{box-sizing:border-box}
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:#000;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
#app{max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.hd{padding:calc(env(safe-area-inset-top) + 16px) 20px 12px}
.hd .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--ac);padding:2px;flex:none;background:none;cursor:pointer}
.avi{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#4A66FF,#16208A);color:#fff;font-weight:600;font-size:14px;letter-spacing:.02em}
.shr{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--ac);background:none;color:var(--tx);font-weight:600;font-size:14px;cursor:pointer}
.shr svg{color:var(--acs)}
.pill{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;white-space:nowrap}
.eb{font-size:14px;font-weight:400;color:var(--mut)}
h1{margin:2px 0 0;font-size:30px;line-height:1.12;font-weight:600;letter-spacing:-.02em}
.main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 20px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.lbl{font-size:13px;color:var(--mut)}
.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:600}
.big{font-size:40px;margin:6px 0 10px;letter-spacing:-.03em}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0}
.sec{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sec b{font-size:18px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;flex-shrink:0;padding:0 20px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.main .chips{padding:0}
.chip{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);white-space:nowrap;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.pks{display:flex;gap:10px;flex-shrink:0}
.sel{flex:1;min-width:0;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.sel .k{display:block;font-size:11px;color:var(--mut)}
.sel .v{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel svg{flex:none;color:var(--acs)}
.opt{width:100%;min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 14px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;font-size:16px;color:var(--mut)}
.opt.on{color:#fff;font-weight:600;background:#141B45;border-radius:14px;border-color:transparent}
.opt svg{color:var(--acs)}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mut)}
.shi{flex:none;width:44px;height:44px;margin:-10px -10px 0 0;border-radius:50%;border:1px solid #ffffff4d;background:#ffffff22;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rt{display:flex;gap:10px;align-items:center}
.btn.red{border-color:var(--red);color:var(--red)}
.g{background:#10301F;color:#6EE7A0}
.pgr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;padding-top:2px}
.pgb{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:14px}
.pgb:disabled{opacity:.35;cursor:default}
.stack{display:flex;gap:12px;flex:none;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;margin:0 -20px -18px;padding:0 20px 28px;scroll-padding-left:20px}
.stack::-webkit-scrollbar{display:none}
.dots{display:flex;justify-content:center;gap:6px;flex-shrink:0}
.dots i{width:6px;height:6px;border-radius:3px;background:#2A2F42;transition:all .2s}
.dots i.on{width:18px;background:var(--ac)}
.r{background:#3A1417;color:#F87171}
.hc{flex:0 0 88%;scroll-snap-align:start;scroll-snap-stop:always;border-radius:26px;padding:20px;display:flex;flex-direction:column;background:linear-gradient(165deg,#12152A,#0C0E17);border:1px solid #232846}
.hc.blue{background:linear-gradient(150deg,#4A66FF 0%,#2438C9 55%,#16208A 100%);border:0;color:#fff;box-shadow:0 12px 28px -14px #3E5BFF99}
.hc .t{font-size:13px;opacity:.8}
.hc.blue .row .lbl{color:#ffffffbb}
.hc .row{padding:5px 0}
.pg{display:flex;justify-content:space-between;font-size:13px;margin-top:auto;padding-top:14px}
.tr{height:8px;border-radius:4px;background:#ffffff26;margin-top:8px;overflow:hidden}
.cb{position:relative;height:12px;border-radius:6px;background:#ffffff26;margin-top:10px;overflow:hidden}
.cb i{position:absolute;top:0;bottom:0}
.cb .b{right:50%;border-radius:6px 0 0 6px}
.cb .a{left:50%;border-radius:0 6px 6px 0}
.cb::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff}
.cb .a,.dot.a{background:#4ADE80}
.cb .b,.dot.b{background:#FBBF24}
.ax{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;opacity:.75}
.lg{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px}
.lg>span{display:flex;align-items:center;gap:6px;min-width:0}
.lg .num{font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.tr i{display:block;height:100%;border-radius:4px;background:#fff}
.hc:not(.blue) .tr{background:var(--line)}
.hc:not(.blue) .tr i{background:var(--ac)}
.tiles{display:flex;gap:8px;margin-top:14px}
.tile{flex:1;background:var(--tile);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ic{width:36px;height:36px;border-radius:50%;background:#3E5BFF26;color:var(--acs);display:flex;align-items:center;justify-content:center}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:20px}
.li .s{font-size:12px;color:var(--mut)}
.li .n{font-weight:600;margin-top:2px}
.up{font-size:12px;font-weight:600;padding:6px 12px;border-radius:14px;background:#3E5BFF26;color:var(--acs);white-space:nowrap}
.dock{display:flex;align-items:center;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom) + 12px)}
.tabs{flex:1;display:flex;background:#10121A;border:1px solid var(--line);border-radius:32px;padding:5px;min-width:0}
.tab{flex:1;min-width:0;min-height:54px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;background:none;border:0;color:var(--mut);cursor:pointer;padding:0}
.tab.on{color:#fff;font-weight:600;background:var(--tile)}
.tab.on svg{color:var(--acs)}
.fab{flex:none;width:56px;height:56px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#fff;cursor:pointer;box-shadow:0 10px 26px -6px #3E5BFFcc}
.fab svg{display:block;flex:none}
.item{width:100%;min-height:48px;display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left}
.bx{width:22px;height:22px;border-radius:7px;border:2px solid #4B5163;display:flex;align-items:center;justify-content:center;margin-right:12px}
.bx.ok{background:var(--ac);border-color:var(--ac)}
.done{color:var(--mut);text-decoration:line-through}
.btn{min-height:48px;width:100%;border-radius:26px;border:1.5px solid var(--ac);background:none;color:var(--tx);font-weight:600;cursor:pointer}
.btn.fill{background:var(--ac);color:#fff}
.tot{display:flex;justify-content:space-between;background:linear-gradient(150deg,#4A66FF,#2438C9);color:#fff;border-radius:22px;padding:16px 18px;font-weight:500}
.bars{display:flex;gap:10px;align-items:flex-end;height:160px;margin-top:10px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;background:none;border:0;cursor:pointer;padding:0}
.bar i{display:block;width:100%;border-radius:8px 8px 0 0;background:#2A2F42}
.bar.on i{background:var(--ac)}
.td{display:flex;font-size:14px;padding:9px 0;border-top:1px solid var(--line)}
.td span{flex:1;text-align:right}.td span:first-child{text-align:left}
.td.h{border:0;color:var(--mut);font-size:12px}.td.on{background:#141B45;margin:0 -8px;padding:9px 8px;border-radius:10px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px}
.w{background:#3A2A10;color:#FCD34D}.i{background:#1B2450;color:#A5B4FF}
.login{height:100%;padding:56px 24px 28px;display:flex;flex-direction:column;overflow-y:auto}
.wl{position:relative;background:radial-gradient(120% 70% at 20% 0%,#16257A 0%,#0A1040 38%,#06070B 78%);overflow:hidden}
.wl::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#5B78FF1f 1px,transparent 1px),linear-gradient(90deg,#5B78FF1f 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:linear-gradient(#000 0%,#0006 55%,transparent 80%);mask-image:linear-gradient(#000 0%,#0006 55%,transparent 80%);pointer-events:none}
.wl>*{position:relative}
.mark{width:64px;height:64px;color:#fff}
.hero{font-size:38px;line-height:1.12;font-weight:300;letter-spacing:.01em;text-transform:uppercase;margin:0}
.hero b{font-weight:700}
.hero em{font-style:normal;font-weight:700;color:var(--ac)}
.hero sup{font-size:.4em;font-weight:400;color:var(--acs);vertical-align:.9em;margin:0 2px}
.go{min-height:64px;border-radius:32px;background:var(--card);border:1px solid #2A3050;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 26px;margin-top:12px;cursor:pointer;font-weight:500;width:100%;text-align:left}
.go span.c{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center}
.lb{min-height:56px;border-radius:28px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;margin-top:12px;cursor:pointer;font-weight:500;width:100%;text-align:left}
.lb.sm{justify-content:center;text-align:center;padding:0 10px;font-size:14px;white-space:nowrap}
.lb.p{background:var(--ac);color:#fff;font-weight:600;border-color:var(--ac)}
#sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.o{display:flex}
.sh{background:var(--bg);width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;border-radius:28px 28px 0 0;padding:22px;border:1px solid var(--line)}
.sh h2{margin:0 0 12px;font-size:20px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.f input,.f select,.sr input,.sr select{min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 12px;width:100%}
.f input[type=date],.f input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;text-align:left}
.f input::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.sr{display:grid;grid-template-columns:1fr 70px 1fr;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.sr .x{grid-column:1/-1}
.cp{font-size:13px;color:var(--mut);margin:12px 0}
.bk{align-self:flex-start;min-height:44px;background:none;border:0;color:var(--mut);cursor:pointer;padding:0 8px 0 0}
.lf label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);margin-top:14px}
.lf input{min-height:54px;border-radius:27px;border:1px solid var(--line);background:var(--card);padding:0 20px;width:100%;font-size:16px}
.pw{position:relative}.pw input{padding-right:100px}
.pw button{position:absolute;right:6px;top:5px;min-width:80px;height:44px;background:none;border:0;color:var(--acs);font-weight:600;cursor:pointer}
#err{min-height:20px;color:var(--red);font-size:13px;margin:10px 0 6px}
.main,.login,.sh,.chips{scrollbar-width:none;-ms-overflow-style:none}
.main::-webkit-scrollbar,.login::-webkit-scrollbar,.sh::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none;width:0;height:0}
:focus-visible{outline:2px solid var(--acs);outline-offset:2px}
@media(max-width:380px){.tab{font-size:9px;letter-spacing:-.02em}.tabs{padding:4px}.fab{width:52px;height:52px}}
</style></head><body>
<div id="app"></div><div id="sheet"></div>
<script>
const $=s=>document.querySelector(s),REG=['Jawa','Sumatera','Lainnya','Ekspor'];
const J='Jawa',S_='Sumatera',L='Lainnya',E='Ekspor';
const S={days:[],done:{},tab:'home',lp:0,top:0,cap:400000,date:0,region:'Semua',metric:'o',in:false,auth:'welcome',user:'',em:'',uid:'',role:'user',st:'',log:[],users:[],busy:true};
const DB=()=>window.DB;
const dbe=(r,m)=>{if(r&&r.error){alert((m||'Gagal menyimpan')+': '+(r.error.message||'kesalahan server'));return true}return false};
const logA=async(a,d)=>{try{if(S.st==='approved')await DB().from('activity_log').insert({a,d:d||'',nama:S.user,email:S.em})}catch(e){}};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('id-ID'),dm=d=>d.slice(8)+'/'+d.slice(5,7);
const sisa=x=>x.s+x.i-x.o,units=x=>x.sh.reduce((a,r)=>a+r[2],0),arm=x=>x.p+x.e+x.x;
const val=(x,k)=>k==='sisa'?sisa(x):k==='unit'?units(x):x[k];
const pc=(a,b)=>b?' ('+(a>=b?'+':'−')+Math.abs((a-b)/b*100).toFixed(1).replace('.',',')+'%)':'';
const dl=(a,b)=>(a>=b?'▲ +':'▼ −')+fmt(Math.abs(a-b))+pc(a,b);
const IC={home:'<path d="M3 11l9-8 9 8v10H3z"/>',ship:'<path d="M1 6h14v11H1zM15 10h4l4 3v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',hist:'<path d="M4 20V10M12 20V4M20 20v-7"/>',ana:'<path d="M3 17l6-6 4 4 8-9M15 6h6v6"/>',pab:'<path d="M3 21h18M5 21V8l5 3V8l5 3V4h4v17"/>',glb:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',ar:'<path d="M5 12h14M13 6l6 6-6 6"/>',out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',act:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',us:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',sh:'<path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/>'};
const svg=(p,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${p}</svg>`;
const CH=svg('<path d="M6 9l6 6 6-6"/>',18),CK=svg('<path d="M4 12l6 6 10-12"/>',18);
const sel=(l,v,act)=>`<button class="sel" data-a="pick" data-v="${act}"><span style="min-width:0"><span class="k">${l}</span><span class="v">${esc(v)}</span></span>${CH}</button>`;
const dd=d=>['Min','Sen','Sel','Rab','Kam','Jum','Sab'][new Date(d+'T00:00:00').getDay()]+', '+dm(d)+'/'+d.slice(2,4);
const dateSel=()=>sel('Tanggal',dm(S.days[S.date].d)+'/'+S.days[S.date].d.slice(2,4),'date');
const MET=[['o','Outbound Logistics'],['sisa','Sisa stok'],['s','Beginning Inventory (07:00)'],['i','Inbound Production'],['unit','Unit kirim']];
const OPT={date:()=>({t:'Pilih tanggal',cur:S.date,o:S.days.map((x,i)=>[i,dd(x.d)]).reverse()}),region:()=>({t:'Pilih wilayah',cur:S.region,o:['Semua',...REG].map(r=>[r,r])}),metric:()=>({t:'Pilih data',cur:S.metric,o:MET})};
const inits=()=>(S.user||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function chart(vals,labels){const n=vals.length,mn=Math.min(...vals),mx=Math.max(...vals);
const P=vals.map((v,i)=>[n>1?40+i*230/(n-1):155,mx===mn?70:115-(v-mn)/(mx-mn)*65]);
return `<svg viewBox="0 0 310 150" width="100%"><line x1="20" y1="120" x2="290" y2="120" stroke="#1C2030"/><polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#4F6BFF" stroke-width="3" stroke-linejoin="round"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#4F6BFF"/>${n<=4||i==0||i==n-1?`<text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="12" font-weight="600" fill="#F5F5F5">${fmt(vals[i])}</text>`:''}<text x="${p[0]}" y="141" text-anchor="middle" font-size="12" fill="#A1A1AA">${labels[i]}</text>`).join('')}</svg>`}

function capCard(D){const cap=S.cap,sv=sisa(D),df=sv-cap,pr=Math.abs(df/cap*100).toFixed(1).replace('.',','),fill=Math.min(100,Math.max(0,sv/cap*100));
const st=df>0?['r','▲ STOK OVER +'+pr+'%','Lebih '+fmt(df)+' ctn dari kapasitas']:df<0?['w','▼ STOK UNDER −'+pr+'%','Kurang '+fmt(-df)+' ctn dari kapasitas']:['g','● SESUAI KAPASITAS','Tepat 100%'];
return `<div class="card"><div class="row" style="padding:0;align-items:center"><b>Kapasitas Whs FG</b><button class="up" style="border:0;cursor:pointer;min-height:36px;padding:0 14px" data-a="cap">Ubah</button></div>
<div style="margin-top:12px"><span class="tag ${st[0]}" style="font-size:13px;padding:5px 12px">${st[1]}</span></div><div class="lbl" style="margin-top:6px">${st[2]}</div>
<div class="tr" style="background:var(--line);margin-top:12px"><i style="width:${fill}%;background:${df>0?'var(--red)':'var(--ac)'}"></i></div>
<div class="row" style="padding:12px 0 2px"><span class="lbl">Sisa stok (setelah Outbound Logistics)</span><span class="num">${fmt(sv)}</span></div><div class="row" style="padding:2px 0 0"><span class="lbl">Kapasitas</span><span class="num">${fmt(cap)} ctn</span></div></div>`}

function home(D){const key=i=>D.d+'-'+i,dn=D.sh.filter((_,i)=>S.done[key(i)]).length,pct=D.sh.length?Math.round(dn/D.sh.length*100):0;
const ag={};D.sh.forEach(r=>ag[r[1]]=(ag[r[1]]||0)+r[2]);const top=Object.keys(ag).sort((a,b)=>ag[b]-ag[a]).slice(0,3);
const okS=D.s>0,ip=okS?D.i/D.s*100:0,op=okS?D.o/D.s*100:0,net=ip-op,mx=Math.max(10,Math.ceil(Math.max(ip,op)/5)*5),p1=v=>v.toFixed(1).replace('.',',')+'%',nsg=net>0.05?'+':net<-0.05?'−':'',ncl=net>0.05?'#86EFAC':net<-0.05?'#FDE68A':'#fff',nar=net>0.05?'▲ ':net<-0.05?'▼ ':'';
const tile=(ic,v,t)=>`<div class="tile"><span class="ic">${svg(IC[ic],18)}</span><div><div class="num" style="font-size:24px">${v}</div><div class="lbl">${t}</div></div></div>`;
return '<div class="pks">'+dateSel()+'</div><button class="btn" style="min-height:42px;margin:10px 0 4px;font-size:14px" data-a="rev">Revisi Outbound Logistics</button>'+`<div class="sec"><b>Hari ini</b></div>
<div class="stack"><div class="hc blue"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div class="t">Sisa stok setelah Outbound Logistics</div><button class="shi" data-a="sharepdf" aria-label="Bagikan PDF" title="Bagikan PDF">${svg(IC.sh,20)}</button></div><div class="num big">${fmt(sisa(D))}</div>
<div class="row"><span class="lbl">Beginning Inventory (07:00)</span><span class="num">${fmt(D.s)}</span></div><div class="row"><span class="lbl">+ Inbound Production</span><span class="num">${fmt(D.i)}</span></div><div class="row"><span class="lbl">− Outbound Logistics</span><span class="num">${fmt(D.o)}</span></div>
<div class="pg"><span>Perubahan bersih vs stok pagi</span><b class="num" style="color:${ncl}">${okS?nar+nsg+p1(Math.abs(net)):'–'}</b></div><div class="cb" role="img" aria-label="Inbound +${p1(ip)}, Outbound −${p1(op)} terhadap stok pagi"><i class="b" style="width:${op/mx*50}%;min-width:${op>0?4:0}px"></i><i class="a" style="width:${ip/mx*50}%;min-width:${ip>0?4:0}px"></i></div><div class="ax"><span>−${mx}%</span><span>Stok pagi (100%)</span><span>+${mx}%</span></div><div class="lg"><span><i class="dot a"></i>Inbound <b class="num">${okS?'+'+p1(ip):'–'}</b></span><span><i class="dot b"></i>Outbound <b class="num">${okS?'−'+p1(op):'–'}</b></span></div></div>
<div class="hc"><div class="t" style="color:var(--mut)">Pengiriman Aktif</div><div class="num big">${dn}<span class="lbl" style="font-size:18px"> / ${D.sh.length}</span></div><div class="lbl">rute sudah terkirim</div>
<div class="pg"><span>Progres</span><span class="num">${pct}%</span></div><div class="tr"><i style="width:${pct}%"></i></div><button class="btn" style="margin-top:16px" data-a="tab" data-v="ship">Lihat Detail</button></div></div><div class="dots"><i class="on"></i><i></i></div>${capCard(D)}
<div class="card"><div class="row" style="padding:0"><b>Status Carrier</b><span class="lbl">Total <span class="num" style="color:var(--tx)">${arm(D)}</span></span></div><div class="tiles">${tile('pab',D.p,'Private Carrier')}${tile('ship',D.e,'Common Carrier')}${tile('glb',D.x,'International Freight Carrier')}</div></div>
<div class="sec"><b>Tujuan terbanyak</b></div>${top.map(c=>`<div class="li"><div><div class="s">Tujuan</div><div class="n">${esc(c)}</div></div><span class="up num">${ag[c]} unit</span></div>`).join('')||'<div class="card lbl">Belum ada pengiriman.</div>'}
<div class="lbl" style="text-align:center">Update: ${dm(D.d)}/${D.d.slice(2,4)}, ${esc(D.u||'-')}</div>`}

function ship(D){const sh=D.sh.map((r,i)=>({r,k:D.d+'-'+i})).filter(o=>S.region==='Semua'||o.r[3]===S.region);
const names=[...new Set(sh.map(o=>o.r[0]))],dn=sh.filter(o=>S.done[o.k]).length;
return '<div class="pks">'+dateSel()+sel('Wilayah',S.region,'region')+'</div>'+`<div class="lbl">Ketuk rute untuk menandai terkirim · ${dn} dari ${sh.length} rute</div>`+
names.map(n=>`<div class="card" style="padding:6px 16px 4px"><b style="display:block;padding:10px 0 6px;font-size:14px">${esc(n)}</b>${sh.filter(o=>o.r[0]===n).map(o=>{const ok=S.done[o.k];return `<button class="item" data-a="done" data-v="${o.k}"><span style="display:flex;align-items:center"><span class="bx ${ok?'ok':''}">${ok?svg('<path d="M4 12l6 6 10-12"/>',14).replace('currentColor','#fff'):''}</span><span class="${ok?'done':''}">${esc(o.r[1])}</span></span><span class="num">${o.r[2]}</span></button>`}).join('')}</div>`).join('')+
(sh.length?'':'<div class="card lbl" style="text-align:center">Tidak ada pengiriman di wilayah ini.</div>')+`<div class="tot"><span>Total unit ditampilkan</span><span class="num">${sh.reduce((a,o)=>a+o.r[2],0)}</span></div>`}

function hist(){const L7=S.days.slice(-7),mx=Math.max(...L7.map(x=>x.o),1),off=S.days.length-L7.length;
return `<div class="card"><b>Outbound Logistics · ketuk batang</b><div class="bars">${L7.map((x,i)=>`<button class="bar ${i+off==S.date?'on':''}" data-a="date" data-v="${i+off}"><span class="num">${fmt(x.o)}</span><i style="height:${Math.round(x.o/mx*105)}px"></i><span class="lbl">${dm(x.d)}</span></button>`).join('')}</div></div>
<div class="card"><div class="td h"><span>Tanggal</span><span>Carrier</span><span>Unit kirim</span><span>Sisa stok</span></div>${L7.map((x,i)=>`<div class="td ${i+off==S.date?'on':''}"><span>${dm(x.d)}</span><span class="num">${arm(x)}</span><span class="num">${units(x)}</span><span class="num">${fmt(sisa(x))}</span></div>`).join('')}</div>
<div class="card"><b>Inbound Production</b>${L7.map(x=>`<div class="row"><span class="lbl">${dm(x.d)}</span><span class="num">${fmt(x.i)}</span></div>`).join('')}</div>`}

function ana(){const L7=S.days.slice(-7),M=MET;
const v=L7.map(x=>val(x,S.metric)),n=v.length,F=L7[0],La=L7[n-1];
let h='<div class="pks">'+sel('Data',M.find(m=>m[0]==S.metric)[1],'metric')+'</div>';
if(n<2)return h+'<div class="card lbl">Tambahkan data minimal 2 hari untuk melihat trend dan analisa.</div>';
const up=v.every((x,i)=>!i||x>=v[i-1]),dw=v.every((x,i)=>!i||x<=v[i-1]);
h+=`<div class="card"><div class="row" style="padding:0"><b>${M.find(m=>m[0]==S.metric)[1]}</b><span class="lbl">${up&&v[n-1]>v[0]?'Tren naik':dw&&v[n-1]<v[0]?'Tren turun':'Fluktuatif'}</span></div>${chart(v,L7.map(x=>dm(x.d)))}</div>
<div class="card"><div class="td h"><span>Tanggal</span><span>Nilai</span><span>Perubahan</span></div>${v.map((x,i)=>`<div class="td"><span>${dm(L7[i].d)}</span><span class="num">${fmt(x)}</span><span class="num">${i?dl(x,v[i-1]):'—'}</span></div>`).join('')}</div><b>Analisa</b>`;
const avg=L7.reduce((a,x)=>a+x.o,0)/n,pu=x=>x.o/Math.max(units(x),1),ag={};La.sh.forEach(r=>ag[r[1]]=(ag[r[1]]||0)+r[2]);
const tc=Object.keys(ag).sort((a,b)=>ag[b]-ag[a])[0],tq=units(La);
const I=[[ 'w','Sisa stok '+(sisa(La)<sisa(F)?'turun ':'naik ')+fmt(Math.abs(sisa(F)-sisa(La))),'Dari '+fmt(sisa(F))+' ('+dm(F.d)+') menjadi '+fmt(sisa(La))+' ('+dm(La.d)+')'+pc(sisa(La),sisa(F))+'.'],
La.i===0?['w','Inbound Production berhenti di '+dm(La.d),'Inbound Production 0 pada hari terakhir. Dengan rata-rata Outbound Logistics '+fmt(Math.round(avg))+' per hari dan tanpa inbound production, sisa stok setara sekitar '+Math.round(sisa(La)/Math.max(avg,1))+' hari.']:['i','Inbound Production '+fmt(La.i)+' pada '+dm(La.d),'Selisih inbound production dikurangi outbound logistics: '+fmt(La.i-La.o)+' pada hari itu.'],
['i','Outbound Logistics per unit kirim '+(pu(La)>=pu(F)?'naik':'turun'),fmt(Math.round(pu(F)))+' → '+fmt(Math.round(pu(La)))+pc(pu(La),pu(F))+'. Dihitung dari outbound logistics dibagi total unit kirim.']];
if(tc)I.push(['i','Tujuan terpusat di '+tc,tc+' menerima '+ag[tc]+' dari '+tq+' unit pada '+dm(La.d)+' ('+Math.round(ag[tc]/tq*100)+'%).']);
return h+I.map(([c,t,x])=>`<div class="card" style="padding:14px 16px"><span class="tag ${c}">${c=='w'?'Perlu perhatian':'Informasi'}</span><div style="font-weight:600;margin:8px 0 4px">${esc(t)}</div><div style="font-size:14px;color:#D4D4D8">${esc(x)}</div></div>`).join('')+`<div class="lbl" style="text-align:center">Dihitung dari ${n} hari data terakhir. Hasil ini perkiraan, bukan prediksi pasti.</div>`}

const LG={login:['Masuk','i'],signup:['Daftar','i'],logout:['Keluar','i'],fail:['Gagal masuk','w'],data:['Data harian','g'],done:['Pengiriman','g'],pdf:['Bagikan PDF','g']};
const PG=10,p2=n=>String(n).padStart(2,'0'),ft=t=>{const x=new Date(t);return p2(x.getDate())+'/'+p2(x.getMonth()+1)+'/'+String(x.getFullYear()).slice(2)+' '+p2(x.getHours())+':'+p2(x.getMinutes())};
function actv(){const L=S.log,n=L.length,pages=Math.max(1,Math.ceil(n/PG));S.lp=Math.min(Math.max(S.lp,0),pages-1);
const sl=L.slice(S.lp*PG,S.lp*PG+PG);
return `<div class="lbl">${n} aktivitas tercatat · ${S.role==='admin'?'semua pengguna':'milik Anda'}</div>`+(n?sl.map(e=>{const g=LG[e.a]||[e.a,'i'];return `<div class="card" style="padding:14px 16px"><div class="row" style="padding:0"><span class="tag ${g[1]}">${esc(g[0])}</span><span class="lbl">${ft(e.t)}</span></div><div style="font-weight:600;margin:8px 0 2px">${esc(e.d||g[0])}</div><div class="lbl">${esc(e.u||'Tidak dikenal')}${e.m?' · '+esc(e.m):''}</div></div>`}).join(''):'<div class="card lbl" style="text-align:center">Belum ada aktivitas tercatat.</div>')+
`<div class="pgr"><button class="pgb" data-a="lp" data-v="-1" ${S.lp<=0?'disabled':''}>‹ Sebelumnya</button><span class="lbl">Hal ${S.lp+1} dari ${pages}</span><button class="pgb" data-a="lp" data-v="1" ${S.lp>=pages-1?'disabled':''}>Berikutnya ›</button></div>`}

const ttl={home:['Selamat datang','Ringkasan harian'],ship:['','Pengiriman ekspedisi'],hist:['Tujuh hari terakhir','Riwayat'],ana:['Tujuh hari terakhir','Trend & analisa'],act:['Siapa melakukan apa','Log aktivitas']};
const arrow=svg(IC.ar,20);
const welcome=()=>`<div class="login wl"><svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="8" width="20" height="20"/><rect x="36" y="8" width="20" height="20" opacity=".5"/><rect x="8" y="36" width="20" height="20" opacity=".5"/><rect x="34" y="34" width="22" height="22" transform="rotate(45 45 45)" stroke="#8FA2FF"/><circle cx="18" cy="18" r="3" fill="currentColor" stroke="none"/></svg><div style="flex:1"></div><h1 class="hero">Pantau,<br>kelola &<br><b>stok</b><sup>°</sup><em>kirim</em></h1><p class="lbl" style="font-size:15px;margin:16px 0 28px;max-width:300px">Pantau stok, armada, dan pengiriman harian dalam satu tempat.</p><button class="go" data-a="auth" data-v="login">Masuk <span class="c">${arrow}</span></button><button class="lb sm" data-a="auth" data-v="signup">Daftar</button></div>`;
const authForm=m=>{const su=m==='signup';return `<div class="login"><button class="bk" data-a="auth" data-v="welcome">‹ Kembali</button><h1 style="font-size:32px;margin-top:24px">${su?'Buat akun':'Masuk'}</h1><p class="lbl" style="font-size:15px;margin:8px 0 0">${su?'Daftar untuk menyimpan data distribusi Anda.':'Masuk untuk melanjutkan ke ringkasan harian.'}</p>
<form class="lf" data-f="${m}" novalidate>${su?'<label>Nama<input name="nm" autocomplete="name" placeholder="Nama lengkap"></label>':''}<label>Email<input name="em" type="email" autocomplete="email" autocapitalize="none" inputmode="email" placeholder="nama@perusahaan.com"></label><label>Kata sandi<span class="pw"><input name="pw" type="password" autocomplete="${su?'new-password':'current-password'}" placeholder="${su?'Minimal 6 karakter':'Kata sandi'}"><button type="button" data-a="eye">Lihat</button></span></label>${su?'<label>Ulangi kata sandi<input name="pw2" type="password" autocomplete="new-password" placeholder="Ketik ulang kata sandi"></label>':''}<div id="err" role="alert"></div><button class="lb p" type="submit" style="margin-top:0">${su?'Daftar':'Masuk'} ${arrow}</button></form>
<div style="flex:1;min-height:16px"></div><button class="lb" style="background:none;border:0;justify-content:center;color:var(--mut);font-weight:400;min-height:44px" data-a="auth" data-v="${su?'login':'signup'}">${su?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button></div>`};
function draw(){const A=$('#app');
if(S.busy){A.innerHTML='<div class="login"><div style="flex:1"></div><p class="lbl" style="text-align:center">Memuat…</p><div style="flex:1"></div></div>';return}
if(!S.in){A.innerHTML=S.auth==='welcome'?welcome():authForm(S.auth);return}
if(S.st!=='approved'){A.innerHTML=pending();return}
const y=($('.main')||{}).scrollTop||0,D=S.days[S.date],t=ttl[S.tab],sub=esc(S.tab==='ship'&&D?dm(D.d)+'/'+D.d.slice(2,4)+' · '+D.sh.length+' rute':S.tab==='home'&&S.user?'Selamat datang, '+S.user:t[0]);
const ini=inits(),body=!D&&S.tab!=='act'?empty():S.tab==='home'?home(D):S.tab==='ship'?ship(D):S.tab==='hist'?hist():S.tab==='act'?actv():ana();
A.innerHTML=`<div class="hd"><div class="top"><button class="av" data-a="acct" aria-label="Akun"><span class="avi">${ini?esc(ini):svg(IC.us,20)}</span></button></div><div class="eb">${sub}</div><h1>${t[1]}</h1></div><div class="main">${body}</div>
<div class="dock"><nav class="tabs">${[['home','Beranda'],['ship','Pengiriman'],['hist','Riwayat'],['ana','Analisa'],['act','Aktivitas']].map(([k,n])=>`<button class="tab ${S.tab==k?'on':''}" data-a="tab" data-v="${k}">${svg(IC[k],20)}${n}</button>`).join('')}</nav>${S.tab==='home'||S.tab==='ship'?'<button class="fab" data-a="form" aria-label="Tambah data harian"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>':''}</div>`;
$('.main').scrollTop=S.top?0:y;S.top=0}

const sheet=h=>{$('#sheet').innerHTML=`<div class="sh">${h}</div>`;$('#sheet').classList.add('o')},closeS=()=>$('#sheet').classList.remove('o');
const rowH=r=>`<div class="sr"><input class="x" placeholder="Ekspedisi" value="${esc(r[0]||'')}"><input placeholder="Kota" value="${esc(r[1]||'')}"><input type="number" min="1" placeholder="Qty" value="${r[2]||''}"><select>${REG.map(g=>`<option ${g==r[3]?'selected':''}>${g}</option>`).join('')}</select></div>`;
const num=(id,l)=>`<label>${l}<input id="${id}" type="number" min="0" inputmode="numeric"></label>`;
function form(){sheet(`<h2>Tambah data harian</h2><div class="f"><label>Tanggal<input id="fd" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Jam update<input id="fu" type="time"></label>${num('fp','Private Carrier')}${num('fe','Common Carrier')}${num('fx','International Freight Carrier')}<span></span>${num('fs','Beginning Inventory (07:00)')}${num('fi','Inbound Production')}${num('fo','Outbound Logistics')}</div><div class="cp">Sisa stok dihitung otomatis: beginning inventory + inbound production − outbound logistics. Jika tanggal sudah ada, datanya diganti.</div><b>Pengiriman</b><div id="rows">${rowH([])}</div><button class="btn" style="margin:12px 0" data-a="addrow">+ Tambah rute</button><button class="btn fill" data-a="save">Simpan data</button><button class="btn" style="margin-top:8px;border-color:#262B3D;color:var(--mut)" data-a="close">Batal</button>`);fillForm($('#fd').value)}
function saveF(){const g=i=>+$('#'+i).value||0,d=$('#fd').value;if(!d){alert('Isi tanggal terlebih dahulu.');return}
const sh=[...document.querySelectorAll('#rows .sr')].map(r=>{const i=r.querySelectorAll('input'),s=r.querySelector('select');return[i[0].value.trim(),i[1].value.trim(),+i[2].value||0,s.value]}).filter(r=>r[0]&&r[1]&&r[2]>0);
const x={d,u:$('#fu').value,p:g('fp'),e:g('fe'),x:g('fx'),s:g('fs'),i:g('fi'),o:g('fo'),sh};
const ex=S.days.some(y=>y.d===d);
DB().from('days').upsert({d,u:x.u,p:x.p,e:x.e,x:x.x,s:x.s,i:x.i,o:x.o,sh:x.sh},{onConflict:'d'}).then(r=>{if(dbe(r))return;S.days=S.days.filter(y=>y.d!==d).concat(x).sort((a,b)=>a.d<b.d?-1:1);logA('data',(ex?'Memperbarui':'Menambah')+' data harian '+dm(d)+'/'+d.slice(2,4)+' · Outbound Logistics '+fmt(x.o)+' · '+sh.length+' rute');S.date=S.days.findIndex(y=>y.d===d);S.tab='home';closeS();draw()})}
const fillForm=d=>{const x=S.days.find(y=>y.d===d),v=(i,k)=>{$('#'+i).value=x&&x[k]?x[k]:''};$('#fu').value=x?x.u||'':'';['p','e','x','s','i','o'].forEach(k=>v('f'+k,k));$('#rows').innerHTML=(x&&x.sh.length?x.sh:[[]]).map(rowH).join('');const h=document.querySelector('#sheet h2');if(h)h.textContent=x?'Ubah data harian':'Tambah data harian'};
document.addEventListener('change',e=>{if(e.target.id==='fd')fillForm(e.target.value)});
const A={tab:v=>{S.tab=v;if(v==='act'){S.lp=0;S.top=1;loadLog()}},lp:v=>{S.lp+=+v;S.top=1},date:v=>S.date=+v,region:v=>S.region=v,metric:v=>S.metric=v,done:v=>{S.done[v]=!S.done[v];dbDone(v);const d=v.slice(0,10),r=((S.days.find(x=>x.d===d)||{}).sh||[])[+v.slice(11)];logA('done',(S.done[v]?'Menandai terkirim: ':'Membatalkan tanda terkirim: ')+(r?r[0]+' → '+r[1]:v)+' ('+dm(d)+'/'+d.slice(2,4)+')')},auth:v=>S.auth=v,eye:(v,t)=>{const i=t.parentNode.querySelector('input');i.type=i.type==='password'?'text':'password';t.textContent=i.type==='password'?'Lihat':'Sembunyi'},close:closeS,form,save:saveF,
addrow:()=>$('#rows').insertAdjacentHTML('beforeend',rowH([])),
sharepdf:()=>{const D=S.days[S.date];if(D)logA('pdf','Bagikan PDF tanggal '+dm(D.d)+'/'+D.d.slice(2,4));sharePdf()},
rev:()=>{const D=S.days[S.date];if(!D)return;sheet(`<h2>Revisi Outbound Logistics</h2><div class="cp">Tanggal ${dm(D.d)}/${D.d.slice(2,4)} · saat ini ${fmt(D.o)}. Hanya angka Outbound yang berubah; data lain tetap.</div><div class="f" style="grid-template-columns:1fr"><label>Outbound Logistics baru<input id="rv" type="number" min="0" inputmode="numeric" value="${D.o}"></label></div><button class="btn fill" style="margin-top:14px" data-a="revsave" data-v="${D.d}">Simpan revisi</button><button class="btn" style="margin-top:8px;border-color:#262B3D;color:var(--mut)" data-a="close">Batal</button>`)},
revsave:async v=>{const D=S.days.find(x=>x.d===v),raw=$('#rv').value,n=+raw;if(!D||raw===''||!(n>=0)){alert('Isi angka Outbound yang valid.');return}
if(n===D.o){closeS();draw();return}
const r=await DB().from('days').update({o:n,updated_at:new Date().toISOString(),updated_by:S.uid}).eq('d',v).select('d');
if(dbe(r))return;if(!r.data||!r.data.length){alert('Revisi tidak tersimpan (tidak ada baris yang berubah). Periksa izin akun Anda.');return}
const old=D.o;D.o=n;logA('data','Merevisi Outbound Logistics '+dm(v)+'/'+v.slice(2,4)+': '+fmt(old)+' → '+fmt(n));closeS();draw()},
cap:()=>S.role!=='admin'?alert('Hanya admin yang dapat mengubah kapasitas.'):sheet(`<h2>Kapasitas Whs FG</h2><div class="f" style="grid-template-columns:1fr"><label>Kapasitas (ctn)<input id="fc" type="number" min="1" inputmode="numeric" value="${S.cap}"></label></div><div class="cp">Stok over/under dihitung dari sisa stok setelah Outbound Logistics dibanding kapasitas ini.</div><button class="btn fill" data-a="capsave">Simpan</button><button class="btn" style="margin-top:8px;border-color:#262B3D;color:var(--mut)" data-a="close">Batal</button>`),
capsave:()=>{const n=Math.round(+$('#fc').value);if(!(n>0)){alert('Isi kapasitas dengan angka lebih dari 0.');return}const o=S.cap;S.cap=n;dbCap(n);if(n!==o)logA('data','Mengubah kapasitas Whs FG: '+fmt(o)+' → '+fmt(n)+' ctn');closeS()},
pick:k=>{const p=OPT[k]();sheet(`<h2>${p.t}</h2>`+p.o.map(([v,t])=>`<button class="opt ${v==p.cur?'on':''}" data-a="set" data-k="${k}" data-v="${esc(v)}"><span>${esc(t)}</span>${v==p.cur?CK:''}</button>`).join(''));const e=document.querySelector('.opt.on');if(e)e.scrollIntoView({block:'center'})},
set:(v,t)=>{const k=t.dataset.k;if(k==='date')S.date=+v;else if(k==='region')S.region=v;else S.metric=v;closeS()},
acct:()=>sheet(`<h2>Akun</h2><div class="card" style="display:flex;align-items:center;gap:14px"><div class="av" style="cursor:default"><span class="avi">${inits()?esc(inits()):svg(IC.us,20)}</span></div><div style="min-width:0"><div style="font-weight:600">${esc(S.user)}</div><div class="lbl">${S.role==='admin'?'Admin':'Pengguna'} · ${esc(S.em)}</div><div class="lbl" style="margin-top:6px;font-size:11px">Jalur login: ${window.DBMODE==='direct'?'langsung':'proxy'} · ${BUILD}</div></div></div>${S.role==='admin'?'<button class="btn" style="margin-top:14px" data-a="users">Kelola pengguna</button>':''}<button class="btn red" style="margin-top:14px" data-a="logout">Keluar</button><button class="btn" style="margin-top:8px;border-color:#262B3D;color:var(--mut)" data-a="close">Batal</button>`),
logout:async()=>{await logA('logout','Keluar dari aplikasi');closeS();try{await DB().auth.signOut()}catch(e){}Object.assign(S,{in:false,user:'',em:'',uid:'',role:'user',st:'',days:[],done:{},log:[],auth:'welcome',tab:'home'});draw()},
recheck:async()=>{S.busy=true;draw();await enter();S.busy=false;draw()},
users:async()=>{const r=await DB().from('profiles').select('*').order('created_at');if(dbe(r,'Gagal memuat pengguna'))return;S.users=r.data;uSheet()},
usr:async v=>{const[id,f,val]=v.split('|');const r=await DB().from('profiles').update({[f]:val}).eq('user_id',id);if(dbe(r))return;const u=S.users.find(x=>x.user_id===id);if(u){u[f]=val;logA('data','Mengubah pengguna '+u.nama+': '+f+' → '+val)}uSheet()},
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(!A[a])return;A[a](t.dataset.v,t);if(!['addrow','form','eye','sharepdf','pick','acct','cap','rev','revsave'].includes(a))draw()});
document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('stack')){const d=t.nextElementSibling;if(d&&d.classList.contains('dots')){const k=t.scrollLeft>(t.scrollWidth-t.clientWidth)/2?1:0;[...d.children].forEach((x,i)=>x.classList.toggle('on',i===k))}}},true);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeS()});

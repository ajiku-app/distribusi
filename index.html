<script>
const $=s=>document.querySelector(s),REG=['Jawa','Sumatera','Lainnya','Ekspor'];
const J='Jawa',S_='Sumatera',L='Lainnya',E='Ekspor';
const S={days:[],done:{},tab:'home',lp:0,top:0,cap:400000,date:0,region:'Semua',metric:'o',per:'d',pk:'',ed:'',fd:'',in:false,auth:'welcome',user:'',em:'',uid:'',role:'user',st:'',log:[],users:[],busy:true,lc:{},lv:'u',sim:25,hp:'d',hk:''};
const DB=()=>window.DB;
const dbe=(r,m)=>{if(r&&r.error){alert((m||'Gagal menyimpan')+': '+(r.error.message||'kesalahan server'));return true}return false};
const logA=async(a,d)=>{try{if(S.st==='approved')await DB().from('activity_log').insert({a,d:d||'',nama:S.user,email:S.em})}catch(e){}};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('id-ID'),dm=d=>d.slice(8)+'/'+d.slice(5,7);
const sisa=x=>x.s+x.i-x.o,units=x=>x.sh.reduce((a,r)=>a+r[2],0),arm=x=>x.p+x.e+x.x;
const val=(x,k)=>k==='sisa'?sisa(x):k==='unit'?units(x):x[k];
